            // 최고치 선택 버프가 있으면 3번 굴려서 최대값
            if (attacker.hasMaxRollBuff) {
                const rolls = [roll3d10(), roll3d10(), roll3d10()];
                roll = Math.max(...rolls);
                rollInfo = ` (굴림: ${rolls.join(', ')})`;
            } else {
                roll = roll3d10();
            }
            
            defender.attackRollsReceived.push({ 
                roll: roll, 
                type: 'skill_B3', 
                attackerId: attacker.id 
            });
            
            // 공격 정보 저장
            attacker.lastAttackTarget = defender;
            attacker.lastAttackType = 'skill_B3';
            attacker.lastAttackIndex = defender.attackRollsReceived.length - 1;
            
            logMessage(`${attacker.name} [흡혈 공격 ${roll}]${rollInfo}`, attacker.id.startsWith('A') ? 'A' : 'B');
            attacker.skill3Available = false;
            finishAction(true);
        }

        // === C 클래스 스킬 ===
        function handleSkill_C1() {
            setupTargeting('skill1', { targetTeam: 'enemy' });
        }

        function handleSkill_C1_Target(attacker, defender) {
            let baseRoll;
            let rollInfo = '';
            
            // 최고치 선택 버프가 있으면 3번 굴려서 최대값
            if (attacker.hasMaxRollBuff) {
                const rolls = [roll3d10(), roll3d10(), roll3d10()];
                baseRoll = Math.max(...rolls);
                rollInfo = ` (굴림: ${rolls.join(', ')})`;
            } else {
                baseRoll = roll3d10();
            }
            
            const roll = baseRoll + 20;
            
            const attackIndex = defender.attackRollsReceived.length;
            defender.attackRollsReceived.push({ 
                roll: roll, 
                type: 'skill_C1', 
                attackerId: attacker.id,
                baseRoll: baseRoll  // 기본 굴림값 저장 (재굴림용)
            });
            
            // 공격 정보 저장 (재굴림을 위해 필요)
            attacker.lastAttackTarget = defender;
            attacker.lastAttackType = 'skill_C1';
            attacker.lastAttackIndex = attackIndex;
            
            logMessage(`${attacker.name} [${getSkillName('C', 1)} ${roll}] (${baseRoll}+20)${rollInfo}`, attacker.id.startsWith('A') ? 'A' : 'B');
            attacker.skill1Available = false;
            finishAction(true);
        }

        function handleSkill_C2() {
            setupTargeting('skill2', { targetTeam: 'ally' });
        }

        function handleSkill_C2_Target(attacker, target) {
            target.isFrozen = true;
            logMessage(`${attacker.name} [${getSkillName('C', 2)}]`, attacker.id.startsWith('A') ? 'A' : 'B');
            attacker.skill2Available = false;
            updateCharacterUI(target);
            finishAction(true);
        }

        function handleSkill_C3() {
            const fixedRoll = 45;
            showModal(
                "C-3: 45 고정",
                `굴림 값을 45로 고정합니다. 행동을 선택하세요.`,
                [
                    { text: "공격 (적)", handler: () => {
                        currentAction = 'skill3';
                        skillC3_action = 'attack';
                        skillC3_roll = fixedRoll;
                        setupTargeting('skill3', { targetTeam: 'enemy' });
                    }},
                    { text: "방어 (아군)", handler: () => {
                        currentAction = 'skill3';
                        skillC3_action = 'defend';
                        skillC3_roll = fixedRoll;
                        setupTargeting('skill3', { targetTeam: 'ally' });
                    }}
                ]
            );
        }

        function handleSkill_C3_Target(attacker, target) {
            if (skillC3_action === 'attack') {
                registerAttack(attacker, target, 'normal', skillC3_roll);
            } else if (skillC3_action === 'defend') {
                target.defendRolls.push({ defenderId: attacker.id, roll: skillC3_roll });
                logMessage(`${attacker.name} [${getSkillName('C', 3)} ${skillC3_roll}]`, attacker.id.startsWith('A') ? 'A' : 'B');
            }
            attacker.skill3Available = false;
            finishAction(true);
        }
    </script>
</body>
</html>
